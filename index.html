<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./noa.svg" />
  <link rel="shortcut icon" type="image/svg+xml" href="./noa.svg" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>NOA Transportes</title>

  <!-- Falcon Config -->
  <script src="./assets/js/config.js" defer></script>
  <script src="./vendors/simplebar/simplebar.min.js" defer></script>

  <!-- Falcon Theme Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- F1a: solo Inter (el diseño no usa las otras seis familias) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="./vendors/simplebar/simplebar.min.css" rel="stylesheet" />
  <link href="./vendors/FontAwesome-pro/css/all.min.css" rel="stylesheet" />
  <link href="./assets/css/theme.min.css" rel="stylesheet" id="style-default">
  <link href="./assets/css/user.min.css" rel="stylesheet" id="user-style-default">



  <script>
    var isRTL = JSON.parse(localStorage.getItem('isRTL'));
    if (isRTL) {
      // Solo RTL descarga sus hojas: se inyectan bajo demanda en vez de
      // descargar los dos themes y descartar uno
      function addRtlCss(href, id) {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
        link.id = id;
        document.head.appendChild(link);
      }
      addRtlCss('./assets/css/theme-rtl.min.css', 'style-rtl');
      addRtlCss('./assets/css/user-rtl.min.css', 'user-style-rtl');
      var linkDefault = document.getElementById('style-default');
      var userLinkDefault = document.getElementById('user-style-default');
      linkDefault.disabled = true;
      linkDefault.setAttribute('disabled', true);
      userLinkDefault.disabled = true;
      userLinkDefault.setAttribute('disabled', true);
      document.querySelector('html').setAttribute('dir', 'rtl');
    }
  </script>
</head>

<body>
  <main class="main">
    <div class="container" data-layout="container">
      <div id="app">
      </div>
    </div>
  </main>
  <script type="module" src="./src/main.js"></script>

  <!-- Falcon Scripts (diferidos: no bloquean el parser, mantienen orden) -->
  <script src="./vendors/popper/popper.min.js" defer></script>
  <script src="./vendors/bootstrap/bootstrap.min.js" defer></script>
  <script src="./vendors/anchorjs/anchor.min.js" defer></script>
  <script src="./vendors/is/is.min.js" defer></script>
  <script src="./vendors/lodash/lodash.min.js" defer></script>
  <script src="./assets/js/theme.js" defer></script>
</body>

</html>
